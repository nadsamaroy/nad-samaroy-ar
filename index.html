<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Над Самарой — Живая открытка</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --white: #ffffff;
      --dark: rgba(0, 0, 0, 0.72);
      --dark-soft: rgba(0, 0, 0, 0.52);
      --accent: #2f80ed;
      --accent-soft: rgba(47, 128, 237, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #000;
      color: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
        radial-gradient(circle at top, rgba(47,128,237,0.28), transparent 45%),
        #000;
    }

    #start-card {
      width: 100%;
      max-width: 460px;
      border-radius: 24px;
      padding: 28px 22px 24px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      text-align: center;
    }

    #project-name {
      font-size: 14px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    #title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 10px;
    }

    #subtitle {
      font-size: 17px;
      line-height: 1.45;
      opacity: 0.92;
      margin: 0 0 20px;
    }

    .steps {
      text-align: left;
      margin: 0 auto 22px;
      padding: 0;
      list-style: none;
      max-width: 340px;
    }

    .steps li {
      margin-bottom: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      font-size: 15px;
      line-height: 1.35;
    }

    .steps li span {
      display: inline-block;
      min-width: 22px;
      font-weight: 700;
      color: #9fd0ff;
    }

    #start-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(47,128,237,0.4);
    }

    #start-note {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.72;
    }

    #brand {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 9999;
      width: calc(100% - 28px);
      max-width: 430px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(8px);
      text-align: center;
      font-size: 16px;
      line-height: 1.35;
      box-shadow: 0 8px 30px rgba(0,0,0,0.28);
    }

    #sound-btn {
      position: fixed;
      right: 16px;
      bottom: 100px;
      z-index: 9999;
      display: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.64);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    #status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #7CFC00;
      box-shadow: 0 0 10px rgba(124,252,0,0.8);
      vertical-align: middle;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <script>
    let video;
    let hint;
    let soundBtn;
    let startScreen;
    let sceneEl;
    let arStarted = false;
    let targetVisible = false;
    let soundEnabled = false;

    function updateSoundButton() {
      if (!soundBtn) return;
      soundBtn.textContent = soundEnabled ? "🔇 Без звука" : "🔊 Включить звук";
    }

    function startAR() {
      if (arStarted) return;
      arStarted = true;

      startScreen.classList.add("hidden");

      const mindarSystem = sceneEl.systems["mindar-image-system"];
      if (mindarSystem) {
        mindarSystem.start();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      video = document.querySelector("#arena-video");
      hint = document.querySelector("#hint");
      soundBtn = document.querySelector("#sound-btn");
      startScreen = document.querySelector("#start-screen");
      sceneEl = document.querySelector("a-scene");

      updateSoundButton();

      document.querySelector("#start-btn").addEventListener("click", startAR);

      soundBtn.addEventListener("click", async () => {
        soundEnabled = !soundEnabled;
        video.muted = !soundEnabled;
        updateSoundButton();

        if (targetVisible) {
          try {
            await video.play();
          } catch (e) {
            console.log("Video play blocked:", e);
          }
        }
      });

      sceneEl.addEventListener("loaded", () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (mindarSystem) {
          mindarSystem.stop();
        }
      });
    });

    AFRAME.registerComponent("video-controller", {
      init: function () {
        this.el.addEventListener("targetFound", async () => {
          targetVisible = true;
          hint.innerHTML = '<span id="status-dot"></span>Самара Арена ожила ✨';
          soundBtn.style.display = "block";
          video.currentTime = 0;

          try {
            await video.play();
          } catch (e) {
            console.log("Video play error:", e);
          }
        });

        this.el.addEventListener("targetLost", () => {
          targetVisible = false;
          hint.innerHTML = "Наведите камеру на открытку";
          soundBtn.style.display = "none";
          video.pause();
        });
      }
    });
  </script>
</head>

<body>

  <div id="start-screen">
    <div id="start-card">
      <div id="project-name">Над Самарой</div>
      <h1 id="title">Живая открытка</h1>
      <p id="subtitle">
        Самара Арена оживает прямо на экране телефона
      </p>

      <ul class="steps">
        <li><span>1.</span> Нажмите кнопку «Запустить открытку»</li>
        <li><span>2.</span> Разрешите доступ к камере</li>
        <li><span>3.</span> Наведите телефон на фотографию</li>
      </ul>

      <button id="start-btn">Запустить открытку</button>

      <div id="start-note">
        Автор проекта: Бобин Сергей
      </div>
    </div>
  </div>

  <div id="brand">НАД САМАРОЙ</div>

  <div id="hint">Наведите камеру на открытку</div>

  <button id="sound-btn">🔊 Включить звук</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <video
        id="arena-video"
        src="./2026-09-19%2009.06.10.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0"
      video-controller>

      <a-video
        src="#arena-video"
        position="0 0 0"
        width="1"
        height="0.667">
      </a-video>

    </a-entity>
  </a-scene>

</body>
</html>
