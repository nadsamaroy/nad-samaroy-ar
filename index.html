<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        user-scalable=no">

  <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">

  <meta http-equiv="Pragma"
        content="no-cache">

  <meta http-equiv="Expires"
        content="0">

  <title>Над Самарой — Живая открытка</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: transparent;
    }


    #ar-container {

      position: absolute;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #start-screen {

      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      color: white;

      background:
        radial-gradient(
          circle at top,
          rgba(42,125,205,0.38),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          rgba(5,16,28,0.96),
          rgba(0,0,0,0.98)
        );

    }


    #start-card {

      width: 100%;
      max-width: 430px;

      padding: 28px 22px;

      text-align: center;

      border-radius: 24px;

      background:
        rgba(255,255,255,0.1);

      border:
        1px solid
        rgba(255,255,255,0.14);

      backdrop-filter:
        blur(12px);

    }


    #project {

      margin-bottom: 10px;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: .18em;

    }


    #title {

      margin: 0 0 12px;

      font-size: 30px;

    }


    #description {

      margin-bottom: 24px;

      line-height: 1.45;

      opacity: .9;

    }


    #start-btn {

      width: 100%;

      padding: 16px;

      border: 0;

      border-radius: 16px;

      color: white;

      font-size: 18px;

      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #297bd7,
          #55c9ee
        );

    }


    #brand {

      position: fixed;

      z-index: 9000;

      top: 17px;
      left: 50%;

      transform:
        translateX(-50%);

      padding:
        10px 18px;

      border-radius: 999px;

      color: white;

      background:
        rgba(0,0,0,.47);

      backdrop-filter:
        blur(10px);

      font-weight: 700;

      letter-spacing: .12em;

    }


    #hint {

      position: fixed;

      z-index: 9000;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%);

      width:
        calc(100% - 30px);

      max-width: 430px;

      padding:
        15px 18px;

      box-sizing: border-box;

      border-radius: 18px;

      color: white;

      text-align: center;

      background:
        rgba(0,0,0,.55);

      backdrop-filter:
        blur(10px);

      font-size: 16px;

    }


    #sound-btn {

      position: fixed;

      z-index: 9001;

      right: 16px;
      bottom: 98px;

      display: none;

      padding:
        13px 17px;

      border: 0;

      border-radius: 999px;

      color: white;

      background:
        rgba(0,0,0,.58);

      backdrop-filter:
        blur(10px);

      font-size: 15px;

      font-weight: 700;

    }


    .hidden {

      display: none !important;

    }


    .green-dot {

      display: inline-block;

      width: 8px;
      height: 8px;

      margin-right: 8px;

      border-radius: 50%;

      background: #65ff57;

      box-shadow:
        0 0 10px
        rgba(101,255,87,.8);

    }

  </style>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        const sceneEl =
          document.querySelector(
            "#ar-scene"
          );


        const target =
          document.querySelector(
            "#arena-target"
          );


        const video =
          document.querySelector(
            "#arena-video"
          );


        const videoPlane =
          document.querySelector(
            "#arena-video-plane"
          );


        const startScreen =
          document.querySelector(
            "#start-screen"
          );


        const startButton =
          document.querySelector(
            "#start-btn"
          );


        const soundButton =
          document.querySelector(
            "#sound-btn"
          );


        const hint =
          document.querySelector(
            "#hint"
          );


        let targetVisible =
          false;


        let soundEnabled =
          false;


        let showTimer =
          null;



        /*
         -------------------------
         ЗАПУСК AR
         -------------------------
        */


        startButton.addEventListener(
          "click",
          async function () {


            /*
             Сначала "разблокируем"
             HTML-video этим
             реальным нажатием пользователя.
            */


            video.muted = true;


            try {

              await video.play();

              video.pause();

              video.currentTime = 0;

            }

            catch (error) {

              console.log(
                "Unlock:",
                error
              );

            }


            startScreen.classList.add(
              "hidden"
            );


            const startSystem =
              () => {


                const arSystem =
                  sceneEl.systems[
                    "mindar-image-system"
                  ];


                if (arSystem) {

                  arSystem.start();

                }

              };


            if (
              sceneEl.hasLoaded
            ) {

              startSystem();

            }

            else {

              sceneEl.addEventListener(
                "loaded",
                startSystem,
                {
                  once: true
                }
              );

            }

          }
        );




        /*
         -------------------------
         ОТКРЫТКА НАЙДЕНА
         -------------------------
        */


        target.addEventListener(
          "targetFound",
          function () {


            targetVisible =
              true;


            clearTimeout(
              showTimer
            );


            video.pause();


            try {

              video.currentTime = 0;

            }

            catch (e) {}


            /*
             До истечения секунды
             AR-видео физически скрыто.
            */


            videoPlane.setAttribute(
              "visible",
              false
            );


            videoPlane.setAttribute(
              "material",
              "opacity",
              0
            );


            soundButton.style.display =
              "none";


            hint.innerHTML =
              '<span class="green-dot"></span>Открытка найдена…';



            /*
             ЖЁСТКАЯ ПАУЗА
             1 СЕКУНДА
            */


            showTimer =
              setTimeout(
                async function () {


                  if (
                    !targetVisible
                  ) {

                    return;

                  }


                  /*
                   Показываем плоскость.
                  */


                  videoPlane.setAttribute(
                    "visible",
                    true
                  );


                  /*
                   Видео запускаем
                   БЕЗ ЗВУКА.

                   Так надёжнее всего
                   на мобильных браузерах.
                  */


                  video.muted =
                    !soundEnabled;


                  video.volume =
                    1;


                  try {

                    await video.play();


                    /*
                     После успешного запуска
                     начинаем fade-in.
                    */


                    videoPlane.setAttribute(
                      "animation__fade",
                      {
                        property:
                          "material.opacity",

                        from:
                          0,

                        to:
                          1,

                        dur:
                          700,

                        easing:
                          "easeInOutQuad"
                      }
                    );


                    hint.innerHTML =
                      '<span class="green-dot"></span>Самара Арена ожила ✨';


                    soundButton.style.display =
                      "block";

                  }


                  catch (error) {


                    console.log(
                      "PLAY ERROR:",
                      error
                    );


                    hint.innerHTML =
                      "Нажмите кнопку ▶ для запуска видео";


                    soundButton.innerHTML =
                      "▶ Запустить видео";


                    soundButton.style.display =
                      "block";

                  }


                },

                1000
              );

          }
        );




        /*
         -------------------------
         ОТКРЫТКА ПОТЕРЯНА
         -------------------------
        */


        target.addEventListener(
          "targetLost",
          function () {


            targetVisible =
              false;


            clearTimeout(
              showTimer
            );


            video.pause();


            try {

              video.currentTime = 0;

            }

            catch (e) {}


            videoPlane.removeAttribute(
              "animation__fade"
            );


            videoPlane.setAttribute(
              "material",
              "opacity",
              0
            );


            videoPlane.setAttribute(
              "visible",
              false
            );


            hint.innerHTML =
              "Наведите камеру на открытку";


            soundButton.style.display =
              "none";

          }
        );




        /*
         -------------------------
         КНОПКА ЗВУКА
         -------------------------
        */


        soundButton.addEventListener(
          "click",
          async function () {


            /*
             Если видео почему-то
             не стартовало автоматически,
             это нажатие запускает его.
            */


            if (
              video.paused
            ) {


              videoPlane.setAttribute(
                "visible",
                true
              );


              video.muted =
                true;


              try {

                await video.play();

              }

              catch (error) {

                console.log(
                  error
                );

              }


              videoPlane.setAttribute(
                "material",
                "opacity",
                1
              );

            }


            /*
             Теперь переключаем звук.
            */


            soundEnabled =
              !soundEnabled;


            video.muted =
              !soundEnabled;


            video.volume =
              1;


            soundButton.innerHTML =
              soundEnabled
              ? "🔇 Выключить звук"
              : "🔊 Включить звук";


            /*
             play() вызываем именно
             внутри клика пользователя.
            */


            try {

              await video.play();

            }

            catch (error) {

              console.log(
                "Audio error:",
                error
              );

            }

          }
        );

      }
    );

  </script>

</head>


<body>


  <div id="start-screen">

    <div id="start-card">

      <div id="project">
        НАД САМАРОЙ
      </div>

      <h1 id="title">
        Живая открытка
      </h1>

      <div id="description">

        Нажмите кнопку,
        разрешите доступ к камере
        и наведите телефон
        на открытку.

      </div>

      <button id="start-btn">

        Запустить открытку

      </button>

    </div>

  </div>



  <div id="brand">

    НАД САМАРОЙ

  </div>



  <button id="sound-btn">

    🔊 Включить звук

  </button>



  <div id="hint">

    Наведите камеру на открытку

  </div>



  <div id="ar-container">


    <a-scene

      id="ar-scene"

      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        uiLoading: no;
        uiError: no;
        uiScanning: no;
      "

      embedded

      color-space="sRGB"

      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
      "

      vr-mode-ui="
        enabled: false
      "

      device-orientation-permission-ui="
        enabled: false
      "

    >


      <a-assets
        timeout="10000"
      >


        <video

          id="arena-video"

          src="./2026-09-19%2009.06.10.mp4"

          preload="auto"

          loop

          muted

          playsinline

          webkit-playsinline

        ></video>


      </a-assets>



      <a-camera

        position="0 0 0"

        look-controls="
          enabled: false
        "

      ></a-camera>



      <a-entity

        id="arena-target"

        mindar-image-target="
          targetIndex: 0
        "

      >


        <a-video

          id="arena-video-plane"

          src="#arena-video"

          position="0 0 0.01"

          width="1"

          height="0.6664"

          visible="false"

          material="
            shader: flat;
            transparent: true;
            opacity: 0;
          "

        ></a-video>


      </a-entity>


    </a-scene>


  </div>


</body>
</html>
